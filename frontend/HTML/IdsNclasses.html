.<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ids and classes</title>
</head>

<body>
    <h3>Ids and classes</h3>
    <div id="mainBox" class="redBg blackblorder"> <!--here i prove 2 classes that is redBg and blackborder (it can be distuinguised by space)-->
        <!-- id never be same for any other tags/elements, we use this to uniquely identify an element -->
        <!-- if you want to give same property of many element then you can create a class where you can store all the changes you want and provide that class to all those element you want to change (unline ids you can give **more than one class to an element**) -->
        this is main box
    </div>
<!-- __________________________________________________________________________________________________________________________________________ -->

    <!-- Emmet -->
    <!-- type span.(name of class) and enter and the element of that class will be formed -->
    <span class="redBg"></span>
    <!-- type span#(id name) to get the element of that id -->
    <span id="uniqueid"></span>
    <!-- . is for class and # is for id, you can use multiple '.' but # is always one -->
    <!-- these thing are known as emmits -->
    <div class="blackbg"></div>
    <!-- emmits div as default if you don't mention any element before . or # -->
    <span id="ids" class="class1 class2"></span>
    <!-- use element.#id.class1.class2 if you want to five multiple classes along with id -->
</body>

</html>
