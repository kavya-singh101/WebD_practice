<!DOCTYPE html> <!--here we are specifying browser that our document type is html-->
<html lang="en"> <!--it's a opening tag, where we are specifying that the atribute language is english-->

<head> <!--it contains all the meta text that is used to describe a website-->
    <!--meta means info(data) about info-->
    <!-- here you can add other files like css, javascript, etc. from your device -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--this contains the content of a web page-->
    hello world
</body>

</html> <!--its a closing tag-->
