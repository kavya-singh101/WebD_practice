<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block elements</title>
</head>
<body>
    <p style="border: 2px solid red;">this is paragraph</p> 
    <p style="border: 2px solid red;">this is also paragraph</p>
    <!-- using span you can continue a line from the previous line ends -->
    <span style="border: 2px solid red;">this is a span</span> 
    <span style="border: 2px solid red;">this is also span</span>
    <!-- the element which can take whole space is a block element (<p>,<h1>) and
    which can't is called inline (<span>,<strong>) --> <br>
    <strong style="border: 2px solid red;">hiii</strong>
    <ul type="circle"  style="border: 2px solid red;">
        <li style="border: 2px solid blue;">This the 1st element of my unordered list</li>
        <li>This the 2nd element of my unordered list</li>
        <!-- li and ul both are block element and div,img is inline -->
        <img src="4c53a26b13d3859a558ae6d8340f0696-700.jpg" alt="image can't be loaded" width="400" height="250" style="border: 2px solid red;" >
</body>
</html>
