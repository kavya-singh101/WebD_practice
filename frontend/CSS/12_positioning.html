<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning using CSS</title>
    <style>
        .container{
            border: 2px solid black;
            background-color: khaki;
            height: 3333px;
        }
        /* CSS postion: static(default), aboulute, relative, fixed, sticky */
        .box {
            display: inline-block;
            border: 2px solid red;
            width: 150px;
            height: 150px;
            margin: 2px;
        }

        #box3 {
            position: static;
            /* it is a by default position */
            position: absolute;
            /* relative to its first parent position */

            position: relative;
            /*move relative to its normal position and will leave a gap at its normal position*/
            /* left: 18px; */

            position: fixed;
            /* the position will be fixed to the place and doesn't move while scrolling it scroll with that*/
            /* position relative to the browser window */
            /* right: 40px;
            bottom: 2px; */
            
            position: sticky;
            /*  */
            top: 3px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
    </div>
</body>

</html>
