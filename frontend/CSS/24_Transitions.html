<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions</title>
    <style>
        #box{
            display: flex;
            height: 200px;
            width: 200px;
            /* background: linear-gradient(to right, #ff0000, #02fff2 70%); */
            background-color: #ff0000;
            justify-content: center;
            align-items: center;
            /* when you hover then the color will change slowly */
            /* transition-property: background-color ;
            transition-duration: 1s;
            transition-timing-function: ease-in;
            transition-delay: 2s; */

            /* shorthand property (one liner) */
            /* transition: background-color duration timing-fun delay; */
            /* transition: background-color 1s ease-in 2s; */

            transition: all 2s ease-in 0.2s;
        }

        #box:hover{
            /* background: linear-gradient(to right, #02fff2,70%, #ff0202); */
            background-color: #3502ff;
            height: 400px;
            width: 300px;
            border-top-left-radius: 15%;
            border-bottom-right-radius: 15%;
            font-size: 25px;
        }
    </style>
</head>

<body>
    <h3>This is css transition</h3>
    <div class="container">
        <div id="box">
            This is transition property
        </div>
    </div>
</body>

</html>
