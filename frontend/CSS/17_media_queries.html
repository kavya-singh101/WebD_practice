<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        .box {
            font-size: 50px;
            text-align: center;
            background-color: red;
            color: black;
            display: none;
        }

        @media (max-width:500px) {
            #box1 {
                display: block;
            }
        }

        @media (max-width:800px) and (min-width:500.1px) {
            #box2 {
                display: block;
                background-color: green;
            }
        }

        @media (max-width:1000px) and (min-width:800.1px) {
            #box3 {
                display: block;
                background-color: yellow;
            }
        }

        @media (min-width:1000.1px) {
            #box4 {
                display: block;
                background-color: blue;
            }
        }
    </style>
</head>

<body>
    <div class="box" id="box1">For iphone</div>
    <div class="box" id="box2">for tablet</div>
    <div class="box" id="box3">for a laptop</div>
    <div class="box" id="box4">for a desktop</div>
</body>

</html>
