<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tut</title>
    <style>
        p {
            color: blue;
            background-color: black !important;
        }
    </style>
    <link rel="stylesheet" href="firstcss.css">

</head>
<!-- if you use both inline and internal css then the css used inline is more precidence than internal. -->
<!-- but although we generally don't prefer inline css -->
<!-- in inline and external which wrote at the last has the higher precidence if you don't want this then use '!important' for high precidence -->

<body>
    <h3>inline, internal & external CSS</h3>
    <h5>inline CSS</h5>
    <p style="color: red; background-color: blue;">I used style inside paragraph tag</p>
    <h5>internal CSS</h5>
    <p>here i use an internal css</p>
</body>

</html>
