<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility and z-index</title>
    <style>
        .box{
            width: 170px;
            height: 170px;
            border: 2px solid black;

        }
        #box1{

            /* z index only work for relative, absolute, fixed and sticky position */

            /* z index is used when you overlap 2 or more block and want to decide which block come on top and which come behind
            more tha number of z index more it came on top to another block */

            position: relative;
            top: 49px;
            z-index: 35;
            background-color: green;
        }
        #box2{
            /* visibility: hidden;  */
            /*make element hide but still it reserver its space*/

            /* display: none;  */
            /*it will disapper the element from the page*/
            position: relative;
            top: 14px;
            z-index: -1;
            background-color: red;
        }
        #box3{
            background-color: blue;
        }
        #box4{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
</body>
</html>
