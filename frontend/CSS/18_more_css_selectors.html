<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More on CSS Selectors</title>
</head>
<style>
    h1 {
        background-color: red;
        color: black;
        font-weight: bold;
        text-align: center;
    }

    /* if p exist directly inside the div then the property will execute */
    div>p {
        color: blue;
        font-weight: bold;
        background-color: yellow;
    }

/* any who came just after div(not inside of it) will get this property */
    div+p {
        color: white;
        background-color: rgb(0, 208, 255);
    }
</style>

<body>
    <h1>heading for selectors</h1>
    <div class="container">
        <div class="row">
            <ul>
                <li class="item">
                    <p>paragraph of ul inside list item</p>
                </li>
                <li>This will not effected</li>
                <p>para inside ul</p>
            </ul>
            <p>This is a paragraph</p>
        </div>
        <p>This is another paragraph</p>
    </div>
    <p>This is outermost paragraph</p>
</body>

</html>
