<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu</title>
    <style>
        .navbar{
            background-color: rgb(0, 0, 0);
            /* if we float anything then the parent colour will be overflow */
            border-radius: 25px;
        }
        .navbar ul{
            /* to reclaim the background color after using float */
            overflow: auto;
        }
        .navbar li{
            padding-top: 3px;
            float: left;
            list-style: none;
            margin: 13px 15px;
        }
        .navbar li a{
            padding: 3px 3px;
            text-decoration: none;
            color: aquamarine;
        }

        .navbar li a:hover{
            color: cyan;
            background-color: rgb(42, 40, 40);
            border-bottom: 2px solid red;
            border-radius: 2px;
        }
        .search{
            float: right;
            padding: 13px 75px;
            color: white;
        }
        .navbar input{
            /* border: 2px solid red; */
            border-radius: 14px;
            padding: 3px 5px;
            /* width: 120px; */
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <!-- # refers to go no where after clicking -->
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Conatct Us</a></li>
                <div class="search">
                    <input type="text" name="search" id="search" placeholder=" search here">
                </div>
            </ul>
        </nav>
    </header>
</body>
</html>
