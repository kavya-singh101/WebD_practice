<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour in CSS</title>
    <style>
        #first {
            color: red;
            /*colour by name*/
        }

        #second {
            color: rgba(30, 102, 225, 0.864);
        }

        #third {
            /* same goes to all type of color property */
            color: #1ae1d1; /*color by hex value*/
        }
    </style>
</head>

<body>
    <h2>Colours in CSS</h2>
    <p id="first">This is my first paragraph</p>
    <p id="second">This is my 2nd paragraph</p>
    <p id="third">This is my 3rd paragraph</p>
</body>

</html>
